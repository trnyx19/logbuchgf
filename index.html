<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logbuch - Windows XP Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop">
        <!-- Window Container -->
        <div class="window">
            <!-- Titlebar -->
            <div class="titlebar">
                <div class="titlebar-text">Logbuch</div>
                <div class="titlebar-controls">
                    <button class="titlebar-button">_</button>
                    <button class="titlebar-button">□</button>
                    <button class="titlebar-button close">✕</button>
                </div>
            </div>

            <!-- Window Content -->
            <div class="window-body">
                <div class="menu-bar">
                    <div class="menu-item">Datei</div>
                    <div class="menu-item">Bearbeiten</div>
                    <div class="menu-item">Ansicht</div>
                    <div class="menu-item">Hilfe</div>
                </div>

                <div class="toolbar">
                    <button class="toolbar-button">← Zurück</button>
                    <button class="toolbar-button">Vorwärts →</button>
                    <button class="toolbar-button">🔄 Aktualisieren</button>
                </div>

                <div class="content">
                    <h1>📓 Meine Logbuch-Einträge</h1>
                    
                    <div id="entries-container" class="entries-container">
                        <div class="loading">Einträge werden geladen...</div>
                    </div>
                </div>
            </div>

            <!-- Statusbar -->
            <div class="statusbar">
                <span>Bereit</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
