<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gute Anfragen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop">
        <!-- Window Container -->
        <div class="window">
            <!-- Titlebar -->
            <div class="titlebar">
                <div class="titlebar-text">Notizen</div>
                <div class="titlebar-controls">
                    <button class="titlebar-button">_</button>
                    <button class="titlebar-button">□</button>
                    <button class="titlebar-button close">✕</button>
                </div>
            </div>

            <!-- Window Content -->
            <div class="window-body">
                <div class="menu-bar">
                    <div class="menu-item" id="menu-datei">Hintergrund</div>
                    <div class="menu-item" id="menu-ansicht">Ansicht</div>
                    <div class="menu-item" id="menu-hilfe">Hilfe</div>
                </div>

                <div class="toolbar">
                    <button class="toolbar-button">← Zurück</button>
                    <button class="toolbar-button">Vorwärts →</button>
                    <button class="toolbar-button">🔄 Aktualisieren</button>
                </div>

                <div class="content">
                    <h1>Alle Freundschaftsanfragen</h1>
                    
                    <div id="entries-container" class="entries-container">
                        <div class="loading">Einträge werden geladen...</div>
                    </div>
                </div>
            </div>

            <!-- Statusbar -->
            <div class="statusbar">
                <span>Bereit</span>
            </div>
        </div>
    </div>

    <!-- Popup für Hintergrundauswahl -->
    <div id="color-picker-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-title">Hintergrundfarbe ändern</div>
            <div class="color-options">
                <button class="color-btn" style="background: linear-gradient(135deg, #0a7fb0 0%, #0f5f8f 100%);">Blau</button>
                <button class="color-btn" style="background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 100%);">Grün</button>
                <button class="color-btn" style="background: linear-gradient(135deg, #6b2d0a 0%, #3a1a05 100%);">Braun</button>
                <button class="color-btn" style="background: linear-gradient(135deg, #4a0e0e 0%, #2a0a0a 100%);">Rot</button>
                <button class="color-btn" style="background: linear-gradient(135deg, #2d2d4a 0%, #1a1a2e 100%);">Dunkel</button>                <button class="color-btn" style="background: linear-gradient(135deg, #1a4a6b 0%, #0a2a4b 100%);"></button>
                <button class="color-btn" style="background: linear-gradient(135deg, #6b4a2d 0%, #3a2a1a 100%);"></button>
                <button class="color-btn" style="background: linear-gradient(135deg, #4a2d6b 0%, #2a1a3a 100%);"></button>
                <button class="color-btn" style="background: linear-gradient(135deg, #6b6b2d 0%, #4a4a1a 100%);"></button>
                <button class="color-btn" style="background: linear-gradient(135deg, #2d6b6b 0%, #1a3a3a 100%);"></button>            </div>
        </div>
    </div>

    <!-- Error Dialog -->
    <div id="error-modal" class="modal hidden">
        <div class="error-dialog">
            <div class="error-titlebar">ERROR</div>
            <div class="error-content">
                <div class="error-icon">⚠️</div>
                <div class="error-text">Hier wird keine Hilfe angeboten!</div>
            </div>
            <div class="error-buttons">
                <button class="error-button" id="close-error">OK</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
